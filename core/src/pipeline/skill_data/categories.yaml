# Skill families (categories) for SEMANTIC skill matching (ADR 0020).
#
# Maps a skill FAMILY → the canonical skills that belong to it. The matcher
# gives a required skill GRADUATED credit: an exact skill match scores full,
# a candidate skill in the SAME family scores partial, an unrelated skill 0.
# This is why a candidate with "react" credits a "frontend development"
# requirement (both `frontend`), while "python" credits nothing toward "voip"
# (different families) — embedding cosine can't separate those reliably
# (calibration: voip↔python 0.72 > react↔frontend 0.70), a curated family map
# can.
#
# A skill may belong to MORE THAN ONE family (list it under each); the matcher
# credits a shared family. Keep names lower-cased and matching the canonical
# names in aliases.yaml. Skills not listed here are categorised by a one-time
# LLM backfill (worker.skill_category_task), constrained to the families below.
#
# The TOP-LEVEL KEYS of this file are the single source of truth for the family
# VOCABULARY (ADR 0021) — `worker.skill_normalize.skill_categories_vocab()` reads
# them, and the LLM backfill may assign only these families. Grow the taxonomy by
# adding a family key here (no code change). `other` and `domain` are deliberate
# catch-alls kept in the vocab but EXCLUDED from family credit by
# `match_non_matchable_families` (they're junk/ambiguous buckets, not a
# relatedness signal). Add freely; matching quality compounds from this map.

# `canvas` is intentionally multi-family: HTML5 Canvas (frontend) AND Canvas LMS
# (edtech). One canonical node carries both families so it credits either
# requirement (ADR 0021 accepts the resulting rare false-positive over a miss).
frontend: [javascript, typescript, react, vue, angular, html, css, jquery, canvas]

- canonical: rest api design
  # New canonical (Phase 4b spelling-recall fix — judgement call, kept
  # tight): the eval JD requires "REST API design" verbatim, but a résumé
  # commonly drops "design" and/or pluralises "API" — none of that is a
  # version or parenthetical variant `_basic_normalise` can strip, so these
  # are real vocabulary spellings, not a normalisation-rule fix. Not a full
  # 8-15-alias expansion — just the handful of spellings actually measured
  # missing (REST APIs / RESTful APIs / REST API).
  aliases:
    ["rest api design", "rest api", "rest apis", "restful api", "restful apis"]


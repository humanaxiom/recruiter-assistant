# Phase-4a ranking-evals thresholds.
#
# Consumed by the `ranking-evals` merge-blocking gate (.claude/agents/ranking-evals.md)
# and (once 4c lands the orchestrator) by run_evals.py. `core/tests/unit/test_evals_corpus.py`
# parses this file today to guard its shape/keys before any evals code exists.
#
# Keys are read literally by both consumers — do not rename a key without updating
# both the gate doc and run_evals.py in the same change.

[precision_at_k]
# Top-k shortlist quality: >= min_precision of the top-k entries must be tagged
# 'strong' or 'borderline' in fixtures/labels.json; none may be 'weak' or
# 'adversarial'. With this corpus (3 strong + 2 borderline = 5 "good" resumes)
# a correct ranking should fill k=5 entirely with good tags.
k = 5
min_precision = 0.8

[evidence]
# Fraction of surfaced evidence quotes that fuzzy-match (>= fuzz_threshold,
# rapidfuzz-style ratio) their cited resume chunk. Must be 1.0 -- any
# unverifiable/fabricated quote reaching output is a hard fail (anti-fabrication
# invariant, docs/EXTRACTION_PLAN.md "Contract invariants").
verification_rate_min = 1.0
# SINGLE SOURCE OF TRUTH NOTE: this value must always equal
# `src.schemas.matching.MatchWeights().evidence_verify_fuzz` (currently 0.85).
# It is repeated here only because thresholds.toml must be readable without
# importing src.* (see run_evals.py's pre-4c import-guard). Do NOT let this
# drift from MatchWeights -- `test_evals_corpus.py` asserts equality between
# the two on every gate run.
fuzz_threshold = 0.85
# Evidence-RECALL floor (Phase-4a strengthening, 4c-required T3): the fraction
# of top-k shortlist entries that must carry >= 1 VERIFIED evidence quote.
# Guards against a vacuous verification_rate_min=1.0 computed over an EMPTY
# surfaced-quote set (e.g. a keyword-stuffer whose quotes were all correctly
# blanked by the fabrication verifier and simply omitted from output, rather
# than causing that candidate to be excluded from top-k in the first place).
min_completeness_in_topk = 1.0

[adversarial]
# Backstop invariant (Phase-4a strengthening, 4c-required T3): an adversarial
# keyword-stuffer (bare keyword overlap, no textually-grounded supporting
# quotes -- see fixtures/resumes/r09_sam_ortiz.json) must NEVER surface in the
# top-k shortlist, however high its raw skill-keyword overlap with the JD is.
# fixtures/labels.json flags every 'adversarial' (and 'weak') resume with
# must_not_surface_in_topk = true; 4c enforces this against the live ranker.
must_not_surface_in_topk = true

[pii]
# The embedding text and any anonymized/exported shortlist output must never
# contain a fixture's candidate name/email/phone (see fixtures/labels.json and
# the *@example.test / 555-01xx synthetic markers in every resume fixture).
leak_check = true
# ADR-007's N1 residual: free-text experience/education fields (company names,
# institutions, bullet text) are allowed to appear -- only the CandidateInfo
# contact fields (name/email/phone) are the leak boundary.
# fixtures/resumes/r12_reese_dawson.json is the positive control: the
# candidate's own name appears inside a structured experience[].bullets[].text
# (allowed, N1 residual) as well as in candidate.name (the actual leak
# boundary) -- see 4c-required T4.
allow_structured_fields = true

[determinism]
# Same inputs -> same ranking order. Evals pin LLM temperature to 0 and expect
# score_final to be byte-identical (delta 0.0) across repeated runs.
temperature = 0.0
max_score_delta = 0.0


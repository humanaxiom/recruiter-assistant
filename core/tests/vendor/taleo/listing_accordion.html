<!--
  Faithful slice of the LIVE SIMOFRAS (SFU) Taleo v2 listing page as of
  May 2026. The live template renders each posting as an accordion of
  <div>s (NOT the <tr> table our earlier synthetic fixtures assumed), so
  find_parent("tr") returns None and the metadata must be read from the
  div.oracletaleocwsv2-accordion-head-info block. Metadata div order is
  [department, employment_type, location]. Each posting also has View /
  Apply links carrying the same rid in accordion-content — those must be
  de-duplicated by external_id (the head title link wins).
-->
<html>
  <body>
    <div class="scroll">
      <div class="oracletaleocwsv2-accordion oracletaleocwsv2-accordion-expandable clearfix">
        <div class="oracletaleocwsv2-accordion-block">
          <div class="oracletaleocwsv2-accordion-head" role="group" tabindex="0" aria-label="click to expand">
            <div class="oracletaleocwsv2-accordion-checkbox checkbox custom-checkbox ckbx-star">
              <label><input name="" type="checkbox" value="" /><i aria-hidden="true" class="fa"></i></label>
            </div>
            <div class="oracletaleocwsv2-accordion-head-info">
              <h4 class="oracletaleocwsv2-head-title">
                <a class="viewJobLink" href="https://tre.tbe.taleo.net/tre01/ats/careers/v2/viewRequisition?org=SIMOFRAS&amp;cws=37&amp;rid=7113">
                  Administrative Coordinator, Equity &amp; Social Accountability - School of Medicine
                </a>
              </h4>
              <div tabindex="0">School of Medicine - Operations</div>
              <div tabindex="0">Permanent Full Time</div>
              <div tabindex="0">Surrey</div>
            </div>
            <span aria-label="Toggle Accordion" class="sr-only" role="graphics-object" tabindex="0">Toggle Accordion</span>
          </div>
          <div class="oracletaleocwsv2-accordion-content">
            <div class="oracletaleocwsv2-btn-grouped">
              <div class="oracletaleocwsv2-btn-grouped-unit">
                <a class="btn btn-default fa-eye" href="https://tre.tbe.taleo.net/tre01/ats/careers/v2/viewRequisition?org=SIMOFRAS&amp;cws=37&amp;rid=7113">View</a>
              </div>
              <div class="oracletaleocwsv2-btn-grouped-unit">
                <a class="btn btn-primary fa-check" href="https://tre.tbe.taleo.net/tre01/ats/careers/v2/applyRequisition?org=SIMOFRAS&amp;cws=37&amp;rid=7113">Apply</a>
              </div>
            </div>
          </div>
        </div>

        <div class="oracletaleocwsv2-accordion-block">
          <div class="oracletaleocwsv2-accordion-head" role="group" tabindex="0" aria-label="click to expand">
            <div class="oracletaleocwsv2-accordion-checkbox checkbox custom-checkbox ckbx-star">
              <label><input name="" type="checkbox" value="" /><i aria-hidden="true" class="fa"></i></label>
            </div>
            <div class="oracletaleocwsv2-accordion-head-info">
              <h4 class="oracletaleocwsv2-head-title">
                <a class="viewJobLink" href="https://tre.tbe.taleo.net/tre01/ats/careers/v2/viewRequisition?org=SIMOFRAS&amp;cws=37&amp;rid=7124">
                  Analyst, Research Computing Systems
                </a>
              </h4>
              <div tabindex="0">Research Computing</div>
              <div tabindex="0">Temporary Full Time</div>
              <div tabindex="0">Burnaby (Hybrid)</div>
            </div>
            <span aria-label="Toggle Accordion" class="sr-only" role="graphics-object" tabindex="0">Toggle Accordion</span>
          </div>
          <div class="oracletaleocwsv2-accordion-content">
            <div class="oracletaleocwsv2-btn-grouped">
              <div class="oracletaleocwsv2-btn-grouped-unit">
                <a class="btn btn-default fa-eye" href="https://tre.tbe.taleo.net/tre01/ats/careers/v2/viewRequisition?org=SIMOFRAS&amp;cws=37&amp;rid=7124">View</a>
              </div>
              <div class="oracletaleocwsv2-btn-grouped-unit">
                <a class="btn btn-primary fa-check" href="https://tre.tbe.taleo.net/tre01/ats/careers/v2/applyRequisition?org=SIMOFRAS&amp;cws=37&amp;rid=7124">Apply</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

{% extends "base.html" %}
{% block title %}{{ entry.display_label }}{% endblock %}
{% block content %}
<h2>{{ entry.display_label }}</h2>
<p>Rank: {{ entry.rank }}</p>
<p>Score: {{ entry.score_final }}</p>
{% if entry.resume_id %}
<p><a href="{{ url_for('resume_detail', resume_id=entry.resume_id) }}">View résumé</a></p>
{% endif %}
{% endblock %}

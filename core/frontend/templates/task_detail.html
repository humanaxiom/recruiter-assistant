<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Task {{ task.id }}</title>
  <style>
    body { background:#0d1117; color:#e6edf3; font-family:ui-monospace,monospace; padding:2rem; }
    .panel { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:1.25rem; margin-bottom:1rem; max-width:820px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:.4rem .6rem; border-bottom:1px solid #30363d; font-size:.85rem; }
    .status { padding:.15rem .5rem; border-radius:4px; background:#1f6feb33; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>{{ task.title }}</h1>
    <p>Status: <span class="status">{{ task.status }}</span> · Branch: <code>{{ task.branch }}</code></p>
  </div>

  <div class="panel">
    <h2>Lineage (Neo4j)</h2>
    <table>
      <tr><th>Subtask</th><th>Agent</th><th>Artifacts</th></tr>
      {% for row in lineage %}
      <tr>
        <td>{{ row.description }}</td>
        <td>{{ row.agent }}</td>
        <td>{{ row.artifacts | join(', ') }}</td>
      </tr>
      {% endfor %}
    </table>
  </div>

  <p><a href="/" style="color:#2f81f7">← back to dashboard</a></p>
</body>
</html>

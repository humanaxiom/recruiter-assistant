{% extends "base.html" %}
{% block title %}Shortlist{% endblock %}
{% block content %}
<h2>Shortlist</h2>
<p><a href="{{ url_for('shortlist_export', job_id=job_id) }}">Export CSV</a></p>
<table>
  <thead><tr><th>Rank</th><th>Candidate</th><th>Score</th></tr></thead>
  <tbody>
    {% for entry in entries %}
    <tr>
      <td>{{ entry.rank }}</td>
      <td><a href="{{ url_for('shortlist_entry_detail', entry_id=entry.id) }}">{{ entry.display_label }}</a></td>
      <td>{{ entry.score_final }}</td>
    </tr>
    {% else %}
    <tr><td colspan="3">No shortlist entries yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}

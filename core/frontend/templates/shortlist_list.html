{% extends "base.html" %}
{% block title %}Shortlist{% endblock %}
{% block content %}
<h2>Shortlist</h2>
<div class="filter-row">
  <a href="{{ url_for('shortlist_export', job_id=job_id) }}">Export CSV</a>
</div>
<button class="btn btn-primary"
        hx-post="{{ url_for('generate_shortlist', job_id=job_id) }}"
        hx-target="#shortlist-cards" hx-swap="outerHTML">
  {{ 'Regenerate shortlist' if entries else 'Generate shortlist' }}
</button>
{% include "shortlist_cards.html" %}
{% endblock %}

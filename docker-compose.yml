name: agent-harness

services:
  # ─── Data Tier ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: harness
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d harness"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/harnesspass
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p harnesspass 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── App Tier ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    environment: &app_env
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/harness
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: harnesspass
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      AGENT_MODEL: qwen2.5-coder:14b
      EMBED_MODEL: nomic-embed-text
      MAX_REVIEW_ITERATIONS: "5"
      COVERAGE_THRESHOLD: "80"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux: reach Ollama on metal
    volumes: ["./core:/app"]
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: arq src.worker.main.WorkerSettings
    environment: *app_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: ["./core:/app"]
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: flask --app frontend.app run --host 0.0.0.0 --port 5000 --debug
    ports: ["5000:5000"]
    environment:
      API_BASE_URL: http://api:8000
      FLASK_SECRET_KEY: dev-only-change-me
    volumes: ["./core:/app"]
    depends_on: [api]

volumes:
  pgdata:
  neo4jdata:

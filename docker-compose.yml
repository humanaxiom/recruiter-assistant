name: recruiter-assistant

services:
  # ─── Data Tier ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: recruiter
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d recruiter"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/recruiterpass
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p recruiterpass 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── App Tier ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    environment: &app_env
      POSTGRES_DSN: postgresql://app:app@postgres:5432/recruiter
      POSTGRES_POOL_MIN: "2"
      POSTGRES_POOL_MAX: "10"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: recruiterpass
      REDIS_URL: redis://redis:6379/0
      # Ollama on host metal — OpenAI-compatible. Never a cloud endpoint.
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL_GENERATION: gpt-oss:20b
      LLM_MODEL_EMBEDDING: nomic-embed-text
      LLM_EMBEDDING_DIM: "768"
      LLM_TIMEOUT_S: "120"
      STORAGE_DIR: /data
      PII_KEY: ${PII_KEY:?PII_KEY must be set — 32 random bytes, base64}
      BLIND_REVIEW_DEFAULT: "true"
      COVERAGE_THRESHOLD: "80"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux: reach Ollama on metal
    volumes:
      - "./core:/app"
      - "./data:/data"                        # filesystem BlobStore
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: arq src.worker.main.WorkerSettings
    environment: *app_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./core:/app"
      - "./data:/data"
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: flask --app frontend.app run --host 0.0.0.0 --port 5000 --debug
    ports: ["5000:5000"]
    environment:
      API_BASE_URL: http://api:8000
      FLASK_SECRET_KEY: dev-only-change-me
    volumes: ["./core:/app"]
    depends_on: [api]

volumes:
  pgdata:
  neo4jdata:
